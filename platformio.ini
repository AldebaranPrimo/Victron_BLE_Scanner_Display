; PlatformIO Project Configuration File
; Victron BLE Gateway for M5StickC / M5StickC Plus
;
; Select environment from VS Code bottom bar:
;   - m5stick-c      -> M5StickC base (display 80x160)
;   - m5stick-c-plus -> M5StickC Plus (display 135x240)

[platformio]
default_envs = m5stick-c

[env:m5stick-c]
platform = espressif32
board = m5stick-c
framework = arduino
board_build.partitions = partitions_noota.csv
lib_deps =
    m5stack/M5StickC@^0.2.5
    knolleary/PubSubClient@^2.8
monitor_speed = 115200
upload_speed = 1500000
build_flags =
    -D M5STICKC

[env:m5stick-c-plus]
platform = espressif32
board = m5stick-c
framework = arduino
board_build.partitions = partitions_noota.csv
lib_deps =
    m5stack/M5StickCPlus@^0.1.0
    knolleary/PubSubClient@^2.8
monitor_speed = 115200
upload_speed = 1500000
build_flags =
    -D M5STICKCPLUS
