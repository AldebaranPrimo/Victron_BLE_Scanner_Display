; PlatformIO Project Configuration File
; Victron BLE Gateway for M5StickC / M5StickC Plus
;
; Select environment from VS Code bottom bar:
;   - m5stick-c-plus -> M5StickC Plus (display 135x240, ST7789v2)  [PRIMARY]
;   - m5stick-c      -> M5StickC base  (display 80x160, ST7735S)   [legacy]
;
; The M5StickC Plus is the physically connected unit and the primary target.
; The base M5StickC env is kept buildable for back-compat; the display code is
; resolution-independent (uses lcd.width()/height()) so both render correctly.

[platformio]
default_envs = m5stick-c-plus

[env:m5stick-c]
platform = espressif32
board = m5stick-c
framework = arduino
board_build.partitions = partitions_noota.csv
lib_deps =
    m5stack/M5StickC@^0.2.5
    knolleary/PubSubClient@^2.8
monitor_speed = 115200
upload_speed = 1500000
build_flags =
    -D M5STICKC

[env:m5stick-c-plus]
platform = espressif32
; Use the dedicated Plus board so PlatformIO picks the correct flash/display
; assumptions for the ST7789v2 panel. The Plus and base both use the ESP32-PICO,
; so if "m5stick-c-plus" is missing from the installed platform's board list,
; fall back to "m5stick-c" here and rely on the -D M5STICKCPLUS flag (which is
; what actually selects the M5StickCPlus library / 135x240 code path).
; NOTE 2026-05-29: the installed espressif32 platform has no "m5stick-c-plus"
; board ID, only "m5stick-c"; applied the documented fallback above.
board = m5stick-c
framework = arduino
; ENV-COMPAT 2026-05-29: with the newer installed pioarduino framework
; (arduino-esp32 3.x), the legacy "m5stick-c" board JSON points at variant
; "m5stick_c" which no longer exists (renamed to "m5stack_stickc*"), causing
; "pins_arduino.h: No such file or directory". Pin the actual Plus variant
; shipped by the framework so the build resolves the correct pins header.
board_build.variant = m5stack_stickc_plus
board_build.partitions = partitions_noota.csv
lib_deps =
    m5stack/M5StickCPlus@^0.1.0
    knolleary/PubSubClient@^2.8
monitor_speed = 115200
upload_speed = 1500000
build_flags =
    -D M5STICKCPLUS
